<mat-card class="admin-panel-card">
  <h2>Subscriptions</h2>
  <table mat-table [dataSource]="subscriptions" class="mat-elevation-z8">

    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef>ID</th>
      <td mat-cell *matCellDef="let s">{{ s.id }}</td>
    </ng-container>

    <ng-container matColumnDef="organization">
      <th mat-header-cell *matHeaderCellDef>Organization</th>
      <td mat-cell *matCellDef="let s">{{ s.organization_name }}</td>
    </ng-container>

    <ng-container matColumnDef="plan">
      <th mat-header-cell *matHeaderCellDef>Plan</th>
      <td mat-cell *matCellDef="let s">{{ s.plan }}</td>
    </ng-container>

    <ng-container matColumnDef="startDate">
      <th mat-header-cell *matHeaderCellDef>Start Date</th>
      <td mat-cell *matCellDef="let s">{{ s.start_date | date:'mediumDate' }}</td>
    </ng-container>

    <ng-container matColumnDef="endDate">
      <th mat-header-cell *matHeaderCellDef>End Date</th>
      <td mat-cell *matCellDef="let s">{{ s.end_date | date:'mediumDate' }}</td>
    </ng-container>

    <ng-container matColumnDef="nextBilling">
      <th mat-header-cell *matHeaderCellDef>Next Billing</th>
      <td mat-cell *matCellDef="let s">{{ s.next_billing_date | date:'mediumDate' }}</td>
    </ng-container>

    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef>Status</th>
      <td mat-cell *matCellDef="let s">{{ s.status }}</td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Actions</th>
      <td mat-cell *matCellDef="let s">
        <button mat-mini-button color="primary" (click)="updateSubscriptionStatus(s, 'Active')">Activate</button>
        <button mat-mini-button color="warn" (click)="updateSubscriptionStatus(s, 'Paused')">Pause</button>
        <button mat-mini-button color="accent" (click)="renewSubscription(s)">Renew</button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

  </table>
</mat-card>
