<div class="auth-page-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-icon-wrap">
        <mat-icon>lock_reset</mat-icon>
      </div>
      <h2>Reset Account Password</h2>
      <p class="subtitle">Enter your registered username and account role to receive recovery credentials</p>
    </div>

    <form (ngSubmit)="submit()" class="auth-form">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Username / User ID</mat-label>
        <input matInput [(ngModel)]="username" name="username" placeholder="e.g. admin or clinicuser" required>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Account Classification</mat-label>
        <mat-select [(ngModel)]="role" name="role" required>
          <mat-option value="Organization">Clinic Administrator</mat-option>
          <mat-option value="Admin">Platform Super Admin</mat-option>
        </mat-select>
      </mat-form-field>

      <div *ngIf="role === 'Organization'">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Clinic Organization Code</mat-label>
          <input matInput [(ngModel)]="code" name="code" placeholder="e.g. ORG1">
        </mat-form-field>
      </div>

      <button mat-raised-button color="primary" class="full-btn" type="submit" [disabled]="loading || !username">
        <mat-icon>send</mat-icon> {{ loading ? 'Sending...' : 'Send Recovery Token' }}
      </button>
    </form>

    <div class="status-alert success" *ngIf="message">
      <mat-icon>check_circle</mat-icon>
      <span>{{ message }}</span>
    </div>

    <div class="status-alert error" *ngIf="error">
      <mat-icon>error</mat-icon>
      <span>{{ error }}</span>
    </div>

    <div class="auth-footer">
      <a routerLink="/login" class="back-link">
        <mat-icon>arrow_back</mat-icon> Back to Sign In
      </a>
    </div>
  </div>
</div>
