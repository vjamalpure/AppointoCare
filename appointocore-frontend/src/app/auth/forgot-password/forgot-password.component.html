<div class="forgot-password-wrapper">
  <mat-card>
    <h2>Forgot Password</h2>
    <form (ngSubmit)="submit()">
      <mat-form-field appearance="fill" class="full-width">
        <mat-label>Username</mat-label>
        <input matInput [(ngModel)]="username" name="username" required>
      </mat-form-field>

      <mat-form-field appearance="fill" class="full-width">
        <mat-label>Role</mat-label>
        <mat-select [(ngModel)]="role" name="role" required>
          <mat-option value="Organization">Organization</mat-option>
          <mat-option value="Admin">Admin</mat-option>
        </mat-select>
      </mat-form-field>

      <div *ngIf="role === 'Organization'">
        <mat-form-field appearance="fill" class="full-width">
          <mat-label>Organization Code</mat-label>
          <input matInput [(ngModel)]="code" name="code">
        </mat-form-field>
      </div>

      <button mat-raised-button color="primary" type="submit" [disabled]="loading">Submit</button>
    </form>

    <div class="message" *ngIf="message">{{ message }}</div>
    <div class="error" *ngIf="error">{{ error }}</div>

    <div class="footer">
      <a routerLink="/login">Back to login</a>
    </div>
  </mat-card>
</div>
