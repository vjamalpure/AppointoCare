<div class="auth-page-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-icon-wrap">
        <mat-icon>vpn_key</mat-icon>
      </div>
      <h2>Set New Password</h2>
      <p class="subtitle">Enter the recovery token received by email or SMS and choose your new password</p>
    </div>

    <form (ngSubmit)="submit()" class="auth-form">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Verification / Recovery Token</mat-label>
        <input matInput [(ngModel)]="token" name="token" placeholder="Paste reset token" required>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>New Secure Password</mat-label>
        <input matInput type="password" [(ngModel)]="newPassword" name="newPassword" placeholder="••••••••" required>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Confirm New Password</mat-label>
        <input matInput type="password" [(ngModel)]="confirmPassword" name="confirmPassword" placeholder="••••••••" required>
      </mat-form-field>

      <button
        mat-raised-button
        color="primary"
        class="full-btn"
        type="submit"
        [disabled]="loading || !token || !newPassword || !confirmPassword"
      >
        <mat-icon>check_circle</mat-icon> {{ loading ? 'Updating...' : 'Update Password' }}
      </button>
    </form>

    <div class="status-alert success" *ngIf="message">
      <mat-icon>check_circle</mat-icon>
      <span>{{ message }}</span>
    </div>

    <div class="status-alert error" *ngIf="error">
      <mat-icon>error</mat-icon>
      <span>{{ error }}</span>
    </div>

    <div class="auth-footer">
      <a routerLink="/login" class="back-link">
        <mat-icon>arrow_back</mat-icon> Back to Sign In
      </a>
    </div>
  </div>
</div>
