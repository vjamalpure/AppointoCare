services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-appointocore_dev_password}
      POSTGRES_DB: appointocore
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d appointocore"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./appointocore-backend
    environment:
      SECRET_KEY: ${SECRET_KEY:-appointocore-dev-secret-change-me}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-appointocore-dev-jwt-secret-change-me}
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-appointocore_dev_password}@db:5432/appointocore
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    ports:
      - '8000:8000'
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.create_connection(('127.0.0.1', 8000), 2); s.close()\""]
      interval: 10s
      timeout: 5s
      retries: 10

  celery:
    build:
      context: ./appointocore-backend
    environment:
      SECRET_KEY: ${SECRET_KEY:-appointocore-dev-secret-change-me}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-appointocore-dev-jwt-secret-change-me}
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-appointocore_dev_password}@db:5432/appointocore
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A celery_worker.celery worker --loglevel=info

  frontend:
    build:
      context: ./appointocore-frontend
    ports:
      - '4200:80'
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
