services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-appointocare_dev_password}
      POSTGRES_DB: appointocare
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d appointocare"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./appointocare-backend
    environment:
      SECRET_KEY: ${SECRET_KEY:-appointocare-dev-secret-change-me}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-appointocare-dev-jwt-secret-change-me}
      APP_ENV: ${APP_ENV:-development}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-superadmin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@12345}
      ORG_USERNAME: ${ORG_USERNAME:-org1}
      ORG_PASSWORD: ${ORG_PASSWORD:-Org@12345}
      STAFF_USERNAME: ${STAFF_USERNAME:-staff1}
      STAFF_PASSWORD: ${STAFF_PASSWORD:-Staff@12345}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4200}
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-appointocare_dev_password}@db:5432/appointocare
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    ports:
      - '8000:8000'
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2)\""]
      interval: 10s
      timeout: 5s
      retries: 10

  celery:
    build:
      context: ./appointocare-backend
    environment:
      SECRET_KEY: ${SECRET_KEY:-appointocare-dev-secret-change-me}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-appointocare-dev-jwt-secret-change-me}
      APP_ENV: ${APP_ENV:-development}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4200}
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-appointocare_dev_password}@db:5432/appointocare
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A celery_worker.celery worker --loglevel=info

  frontend:
    build:
      context: ./appointocare-frontend
    ports:
      - '4200:80'
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
