<div class="reset-password-wrapper">
  <mat-card>
    <h2>Reset Password</h2>
    <form (ngSubmit)="submit()">
      <mat-form-field appearance="fill" class="full-width">
        <mat-label>Reset Token</mat-label>
        <input matInput [(ngModel)]="token" name="token" required>
      </mat-form-field>

      <mat-form-field appearance="fill" class="full-width">
        <mat-label>New Password</mat-label>
        <input matInput type="password" [(ngModel)]="newPassword" name="newPassword" required>
      </mat-form-field>

      <mat-form-field appearance="fill" class="full-width">
        <mat-label>Confirm Password</mat-label>
        <input matInput type="password" [(ngModel)]="confirmPassword" name="confirmPassword" required>
      </mat-form-field>

      <button mat-raised-button color="primary" type="submit" [disabled]="loading">Reset Password</button>
    </form>

    <div class="message" *ngIf="message">{{ message }}</div>
    <div class="error" *ngIf="error">{{ error }}</div>

    <div class="footer">
      <a routerLink="/login">Back to login</a>
    </div>
  </mat-card>
</div>
