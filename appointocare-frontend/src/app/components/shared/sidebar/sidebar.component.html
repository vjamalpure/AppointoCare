<aside class="sidebar" [class.collapsed]="isCollapsed">
  <div class="sidebar-top">
    <div class="role-indicator" *ngIf="!isCollapsed">
      <span class="role-badge-pill">{{ role === 'Admin' ? 'Super Admin' : (role || 'User') }}</span>
      <span class="org-subtext" *ngIf="orgName">{{ orgName }}</span>
    </div>
  </div>

  <nav class="sidebar-nav">
    <ul class="nav-list">
      <li *ngFor="let item of menuItems" class="nav-item">
        <a [routerLink]="item.route"
           routerLinkActive="active"
           [routerLinkActiveOptions]="{ exact: item.exact || false }"
           class="nav-link"
           [title]="item.label">
          <mat-icon class="nav-icon">{{ item.icon }}</mat-icon>
          <span class="nav-label" *ngIf="!isCollapsed">{{ item.label }}</span>
        </a>
      </li>
    </ul>
  </nav>

  <div class="sidebar-bottom">
    <button type="button" class="sidebar-footer-toggle" (click)="toggleSidebar()" [title]="isCollapsed ? 'Expand Sidebar' : 'Collapse Sidebar'">
      <mat-icon>{{ isCollapsed ? 'chevron_right' : 'chevron_left' }}</mat-icon>
      <span *ngIf="!isCollapsed" class="toggle-text">Collapse Menu</span>
    </button>
  </div>
</aside>
