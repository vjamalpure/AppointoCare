<aside class="sidebar" [class.collapsed]="isCollapsed">
  <!-- Sidebar Header -->
  <div class="sidebar-header">
    <div class="sidebar-brand" *ngIf="!isCollapsed">
      <div class="brand-mini-row">
        <mat-icon class="pulse-spark">auto_awesome</mat-icon>
        <span class="brand-portal">PORTAL NAVIGATION</span>
      </div>
    </div>
    <button mat-icon-button class="toggle-btn" (click)="toggleSidebar()" [matTooltip]="isCollapsed ? 'Expand Menu' : 'Collapse Menu'">
      <mat-icon>{{ isCollapsed ? 'chevron_right' : 'chevron_left' }}</mat-icon>
    </button>
  </div>

  <!-- Navigation Items -->
  <nav class="sidebar-nav">
    <ul class="nav-list">
      <li *ngFor="let item of menuItems" class="nav-item">
        <a
          [routerLink]="item.route"
          [routerLinkActive]="'active'"
          [routerLinkActiveOptions]="{ exact: !!item.exact }"
          class="nav-link"
          [matTooltip]="isCollapsed ? item.label : ''"
          matTooltipPosition="right"
        >
          <div class="nav-icon-wrap">
            <mat-icon class="nav-icon">{{ item.icon }}</mat-icon>
          </div>
          <span class="nav-label" *ngIf="!isCollapsed">{{ item.label }}</span>
        </a>
      </li>
    </ul>
  </nav>

  <!-- Sidebar Footer / Role Card -->
  <div class="sidebar-footer" *ngIf="role">
    <div class="user-chip">
      <div class="user-avatar-wrap">
        <div class="user-avatar">{{ username ? username.charAt(0).toUpperCase() : 'U' }}</div>
        <span class="status-indicator-dot" title="Active Connection"></span>
      </div>
      <div class="user-details" *ngIf="!isCollapsed">
        <div class="user-name">{{ username || 'User' }}</div>
        <div class="user-sub-row">
          <span class="role-badge" [ngClass]="'role-' + (role | lowercase)">
            {{ getRoleBadgeLabel() }}
          </span>
          <span class="org-sub-name" *ngIf="orgName">{{ orgName }}</span>
        </div>
      </div>
    </div>
  </div>
</aside>
