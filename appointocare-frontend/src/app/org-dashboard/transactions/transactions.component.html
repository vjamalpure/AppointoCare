<div class="transactions-container" style="padding: 16px;">
  <h2>Transactions</h2>

  <div *ngIf="transactions.length === 0" class="empty-state" style="text-align:center; padding: 16px;">
    <mat-icon>receipt_long</mat-icon>
    <p>No transactions found.</p>
  </div>

  <div *ngIf="transactions.length > 0">
    <div class="chart-section" style="height: 320px; margin-bottom: 16px;">
      <canvas baseChart
        [datasets]="transactionChartData"
        [labels]="transactionChartLabels"
        [options]="transactionChartOptions"
        [legend]="true"
        [type]="chartType">
      </canvas>
    </div>

    <mat-table [dataSource]="transactions" class="mat-elevation-z2">
      <ng-container matColumnDef="date">
        <mat-header-cell *matHeaderCellDef>Date</mat-header-cell>
        <mat-cell *matCellDef="let t">{{ t.created_at | date:'mediumDate' }}</mat-cell>
      </ng-container>

      <ng-container matColumnDef="amount">
        <mat-header-cell *matHeaderCellDef>Amount</mat-header-cell>
        <mat-cell *matCellDef="let t">₹{{ t.amount }}</mat-cell>
      </ng-container>

      <ng-container matColumnDef="status">
        <mat-header-cell *matHeaderCellDef>Status</mat-header-cell>
        <mat-cell *matCellDef="let t">
          <span [ngClass]="{'success': t.status === 'success', 'failed': t.status === 'failed'}">{{ t.status | titlecase }}</span>
        </mat-cell>
      </ng-container>

      <ng-container matColumnDef="type">
        <mat-header-cell *matHeaderCellDef>Type</mat-header-cell>
        <mat-cell *matCellDef="let t">{{ t.transaction_type | titlecase }}</mat-cell>
      </ng-container>

      <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
      <mat-row *matRowDef="let row; columns: displayedColumns;"></mat-row>
    </mat-table>
  </div>
</div>
