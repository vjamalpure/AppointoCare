<div class="org-bookings">
  <h2>Bookings</h2>
  <mat-table [dataSource]="bookings" class="mat-elevation-z8" *ngIf="!loading && bookings.length">
    <ng-container matColumnDef="appointment_date">
      <th mat-header-cell *matHeaderCellDef>Date</th>
      <td mat-cell *matCellDef="let booking">{{ booking.appointment_date | date:'medium' }}</td>
    </ng-container>

    <ng-container matColumnDef="customer_name">
      <th mat-header-cell *matHeaderCellDef>Name</th>
      <td mat-cell *matCellDef="let booking">{{ booking.customer_name }}</td>
    </ng-container>

    <ng-container matColumnDef="customer_phone">
      <th mat-header-cell *matHeaderCellDef>Phone</th>
      <td mat-cell *matCellDef="let booking">{{ booking.customer_phone }}</td>
    </ng-container>

    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef>Status</th>
      <td mat-cell *matCellDef="let booking">{{ booking.status }}</td>
    </ng-container>

    <ng-container matColumnDef="payment_status">
      <th mat-header-cell *matHeaderCellDef>Payment</th>
      <td mat-cell *matCellDef="let booking">{{ booking.payment_status }}</td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Actions</th>
      <td mat-cell *matCellDef="let booking">
        <button mat-button color="primary" (click)="sendReminder(booking)">Send Reminder</button>
        <button mat-button color="accent" (click)="updateStatus(booking, 'Completed')">Complete</button>
        <button mat-button color="warn" (click)="updateStatus(booking, 'Cancelled')">Cancel</button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </mat-table>

  <div *ngIf="loading">Loading bookings...</div>
  <div *ngIf="!loading && !bookings.length">No bookings found.</div>
  <div *ngIf="message" class="booking-message">{{ message }}</div>
</div>
